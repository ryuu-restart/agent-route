# AgentRoute full template for Surge. Merge the sections; never replace the whole profile.
# Replace PROXY with the real policy. A managed profile cannot be edited: read docs/CLIENTS.md first.
# Requires Surge Mac 5.10.0+ for RULE-SET in [Host].
[General]
dns-server = 223.5.5.5
encrypted-dns-server = https://1.1.1.1/dns-query
# Without this, encrypted DNS connections stay DIRECT. A proxy whose server is a domain still
# falls back to DIRECT for these connections, so the policy must use a node with an IP address.
encrypted-dns-follow-outbound-mode = true
ipv6 = true
ipv6-vif = auto
# Add node server domains to this list as well.
always-real-ip = localhost, *.lan, *.local, *.home.arpa
hijack-dns = *:53

[Rule]
# User exceptions stay above this block. Add node servers next:
#   DOMAIN,node.example.com,DIRECT
#   IP-CIDR,203.0.113.10/32,DIRECT,no-resolve
# >>> AgentRoute managed begin
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,home.arpa,DIRECT
IP-CIDR,198.18.0.0/15,REJECT,no-resolve
IP-CIDR6,fc00::/18,REJECT,no-resolve
IP-CIDR6,fd00:6152::/64,REJECT,no-resolve
IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
IP-CIDR6,ff00::/8,DIRECT,no-resolve
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
IP-CIDR,1.1.1.1/32,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/private.list,DIRECT,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/reject.list,REJECT,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/proxy.list,PROXY,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/direct.list,DIRECT,update-interval=86400
# A request that arrives as a bare IP still gets checked against its SNI / Host header.
AND,((OR,((HOSTNAME-TYPE,IPv4),(HOSTNAME-TYPE,IPv6))),(RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/private.list,extended-matching)),DIRECT
AND,((OR,((HOSTNAME-TYPE,IPv4),(HOSTNAME-TYPE,IPv6))),(RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/proxy.list,extended-matching)),PROXY
AND,((OR,((HOSTNAME-TYPE,IPv4),(HOSTNAME-TYPE,IPv6))),(RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/direct.list,extended-matching)),DIRECT
# no-resolve: IP-CIDR tests only the first IPv4 record and IP-CIDR6 the first IPv6 one, so
# a domain with mixed China and other answers would go DIRECT. Unknown domains use FINAL;
# requests that target an IP still match. Dropping no-resolve breaks that goal.
RULE-SET,https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/cn-ip.list,DIRECT,no-resolve,update-interval=86400
FINAL,PROXY,dns-failed
# <<< AgentRoute managed end

[Host]
localhost = 127.0.0.1
*.lan = server:system
# Bonjour needs the OS resolver library; server:system would use unicast DNS in enhanced mode.
*.local = server:force-syslib
*.home.arpa = server:system
RULE-SET:https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/private.list = server:system
RULE-SET:https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/direct.list = server:https://223.5.5.5/dns-query
RULE-SET:https://raw.githubusercontent.com/ryuu-restart/agent-route/release/surge/proxy.list = server:https://1.1.1.1/dns-query
