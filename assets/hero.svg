<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc">
  <title id="title">AgentRoute：备份接入、规则分流、浏览器验收</title>
  <desc id="desc">Agent 读取 AGENTS.md 和规则索引，备份后替换旧业务分流与默认兜底，保留节点与订阅。五类业务规则按内网、拦截、代理、直连、中国 IP 的顺序匹配，未匹配走代理；独立 WebRTC 防护优先于业务规则。检查所有浏览器，为支持的配置档自动安装并配置防护，执行 IP、DNS 和 WebRTC 检测，交付恢复方法。</desc>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
    <rect x="1" y="1" width="1078" height="408" rx="20" fill="#0d1117" stroke="#303b4a"/>
    <rect x="22" y="22" width="324" height="366" rx="14" fill="#161e29" stroke="#303b4a"/>
    <text x="42" y="52" font-size="16" fill="#98caff" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">01</text>
    <text x="42" y="88" font-size="23" fill="#f0f6fc" font-weight="700">Agent 自动接入</text>
    <path d="M42 105 H326" stroke="#303b4a"/>
    <rect x="378" y="22" width="324" height="366" rx="14" fill="#161e29" stroke="#303b4a"/>
    <text x="398" y="52" font-size="16" fill="#7ee2b8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">02</text>
    <text x="398" y="88" font-size="23" fill="#f0f6fc" font-weight="700">五类业务分流</text>
    <path d="M398 105 H682" stroke="#303b4a"/>
    <rect x="734" y="22" width="324" height="366" rx="14" fill="#161e29" stroke="#303b4a"/>
    <text x="754" y="52" font-size="16" fill="#ffd28e" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">03</text>
    <text x="754" y="88" font-size="23" fill="#f0f6fc" font-weight="700">浏览器配置与验收</text>
    <path d="M754 105 H1038" stroke="#303b4a"/>
    <path d="M348 204 L372 204" stroke="#60768e" stroke-width="2" fill="none"/><path d="M366 198 L372 204 L366 210" stroke="#60768e" stroke-width="2" fill="none"/>
    <path d="M704 204 L728 204" stroke="#60768e" stroke-width="2" fill="none"/><path d="M722 198 L728 204 L722 210" stroke="#60768e" stroke-width="2" fill="none"/>
    <text x="42" y="140" font-size="19" fill="#f0f6fc" font-weight="600">读取说明与索引</text>
    <text x="42" y="168" font-size="15" fill="#a9b9cb" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">AGENTS.md → release/index.json</text>
    <text x="42" y="216" font-size="19" fill="#f0f6fc" font-weight="600">备份后替换旧业务规则</text>
    <text x="42" y="244" font-size="17" fill="#a9b9cb" font-weight="400">保留节点、订阅与必要技术规则</text>
    <text x="42" y="292" font-size="19" fill="#f0f6fc" font-weight="600">回读生效配置与实际出站</text>
    <text x="42" y="320" font-size="17" fill="#a9b9cb" font-weight="400">刷新订阅后复查，交付恢复方法</text>
    <text x="42" y="365" font-size="16" fill="#98caff" font-weight="400">沿用你现有的客户端与节点</text>
    <text x="398" y="140" font-size="16" fill="#a9b9cb" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">01</text>
    <text x="432" y="140" font-size="18" fill="#d5dfeb" font-weight="400">内网直连</text>
    <rect x="602" y="118" width="80" height="28" rx="6" fill="#16352b"/>
    <text x="611" y="138" font-size="15" fill="#7ee2b8" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DIRECT</text>
    <text x="398" y="178" font-size="16" fill="#a9b9cb" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">02</text>
    <text x="432" y="178" font-size="18" fill="#d5dfeb" font-weight="400">广告拦截</text>
    <rect x="602" y="156" width="80" height="28" rx="6" fill="#3b222c"/>
    <text x="611" y="176" font-size="15" fill="#ffa7b4" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">REJECT</text>
    <text x="398" y="216" font-size="16" fill="#a9b9cb" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">03</text>
    <text x="432" y="216" font-size="18" fill="#d5dfeb" font-weight="400">海外代理</text>
    <rect x="602" y="194" width="80" height="28" rx="6" fill="#192e49"/>
    <text x="611" y="214" font-size="15" fill="#98caff" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PROXY</text>
    <text x="398" y="254" font-size="16" fill="#a9b9cb" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">04</text>
    <text x="432" y="254" font-size="18" fill="#d5dfeb" font-weight="400">国内直连</text>
    <rect x="602" y="232" width="80" height="28" rx="6" fill="#16352b"/>
    <text x="611" y="252" font-size="15" fill="#7ee2b8" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DIRECT</text>
    <text x="398" y="292" font-size="16" fill="#a9b9cb" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">05</text>
    <text x="432" y="292" font-size="18" fill="#d5dfeb" font-weight="400">中国 IP 兜底</text>
    <rect x="602" y="270" width="80" height="28" rx="6" fill="#16352b"/>
    <text x="611" y="290" font-size="15" fill="#7ee2b8" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">DIRECT</text>
    <text x="398" y="330" font-size="17" fill="#a9b9cb" font-weight="400">另接入独立 WebRTC 防护</text>
    <text x="398" y="365" font-size="18" fill="#7ee2b8" font-weight="600">未匹配流量 → 默认代理</text>
    <text x="754" y="140" font-size="19" fill="#f0f6fc" font-weight="600">检查本机所有浏览器</text>
    <text x="754" y="168" font-size="18" fill="#a9b9cb" font-weight="400">识别实际使用的配置档</text>
    <text x="754" y="216" font-size="19" fill="#f0f6fc" font-weight="600">支持的浏览器自动配好</text>
    <text x="754" y="244" font-size="18" fill="#a9b9cb" font-weight="400">补装扩展或使用适配方案</text>
    <text x="754" y="292" font-size="19" fill="#f0f6fc" font-weight="600">同一配置档三项实测</text>
    <text x="754" y="320" font-size="18" fill="#a9b9cb" font-weight="400">IP 出口 · DNS · WebRTC</text>
    <text x="754" y="365" font-size="17" fill="#ffd28e" font-weight="400">逐项报告结果与未验证项</text>
  </g>
</svg>
